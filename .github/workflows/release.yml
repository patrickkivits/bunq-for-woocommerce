name: Release

# Builds a plugin zip whose top-level folder is always the plugin slug and attaches it to the GitHub release.
# GitHub's own source archives unpack to "<repo>-<tag>/", which makes WordPress treat every release as a
# different plugin instead of an upgrade of the installed one. The slug is "pay-with-bunq-for-woocommerce" since
# 2.1.0 (the wordpress.org name) and "bunq-for-woocommerce" for older tags.
#
# A full (not pre-)release is also deployed to wordpress.org, once the SVN_USERNAME and SVN_PASSWORD secrets are
# set. "released" fires both for a new full release and for a pre-release promoted with
# `gh release edit <tag> --prerelease=false`.

on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build the zip for, e.g. v1.5.9'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and attach plugin zip
    if: github.event.action != 'released'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Determine the plugin slug of this tag
        run: |
          if [ -f pay-with-bunq-for-woocommerce.php ]; then slug=pay-with-bunq-for-woocommerce; else slug=bunq-for-woocommerce; fi
          echo "SLUG=$slug" >> "$GITHUB_ENV"

      - name: Check that the plugin header version matches the tag
        run: |
          header=$(sed -n 's/^ \* Version: *//p' "$SLUG.php" | head -n1)
          echo "Tag: $TAG, plugin header: $header"
          if [ "v$header" != "$TAG" ] && [ "$header" != "$TAG" ]; then
            echo "::error::Plugin header version ($header) does not match release tag ($TAG)"
            exit 1
          fi

      - name: Check that readme.txt describes this version
        run: |
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt | tr -d '\r')
          header=$(sed -n 's/^ \* Version: *//p' "$SLUG.php" | head -n1)
          echo "readme.txt Stable tag: $stable, plugin header: $header"
          if [ "$stable" != "$header" ]; then
            echo "::error::readme.txt Stable tag ($stable) does not match the plugin version ($header)"
            exit 1
          fi
          if ! grep -q "^= $header =" readme.txt; then
            echo "::error::readme.txt has no changelog entry for $header"
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Build the zip with a fixed top-level folder
        run: |
          # Development files are left out by git archive through the export-ignore attributes in .gitattributes,
          # the single place that lists them; vendor/ is not committed but installed from composer.lock. Same as
          # .github/scripts/build-plugin.sh, spelled out because tags from before that script are rebuilt too.
          mkdir -p "build/$SLUG"
          git archive --format=tar "$TAG" | tar -x -C "build/$SLUG"
          composer install --working-dir="build/$SLUG" --no-dev --optimize-autoloader --no-interaction --no-progress
          (cd build && zip -qrX "../$SLUG.zip" "$SLUG")
          unzip -l "$SLUG.zip" | head -n 20

      - name: Check that the zip holds every tracked file, the dependencies and nothing else
        run: |
          # Every file tracked at the tag that is not marked export-ignore must be in the zip under the fixed
          # folder; apart from those only the installed vendor/ directory may be in it (older tags still track it).
          git ls-tree -r --name-only "$TAG" \
            | git check-attr --stdin export-ignore \
            | awk -F': ' '$3 != "set" { print $1 }' \
            | grep -v '^vendor/' \
            | sed "s|^|$SLUG/|" | sort > expected.txt
          unzip -Z1 "$SLUG.zip" | grep -v '/$' | grep -v "^$SLUG/vendor/" | sort > actual.txt
          if ! diff -u expected.txt actual.txt; then
            echo "::error::Zip content differs from the tracked files ('-' missing from zip, '+' unexpected in zip)"
            exit 1
          fi
          if ! unzip -Z1 "$SLUG.zip" | grep -qx "$SLUG/vendor/autoload.php"; then
            echo "::error::The zip has no vendor/autoload.php"
            exit 1
          fi
          echo "$(wc -l < actual.txt) tracked files and $(unzip -Z1 "$SLUG.zip" | grep -v '/$' | grep -c "^$SLUG/vendor/") dependency files verified"

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$SLUG.zip" --clobber

  wordpress-org:
    name: Deploy to wordpress.org
    # Only the 2.x line is on wordpress.org: the 1.x tags have no pay-with-bunq-for-woocommerce.php (checked below)
    # and their own release.yml does not listen to "released".
    if: github.event.action == 'released'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      SLUG: pay-with-bunq-for-woocommerce
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check that this release belongs on wordpress.org
        id: check
        run: |
          if [ -z "$SVN_USERNAME" ] || [ -z "$SVN_PASSWORD" ]; then
            echo "::notice::SVN_USERNAME or SVN_PASSWORD is not set, skipping the wordpress.org deploy"
          elif [ ! -f "$SLUG.php" ]; then
            echo "::notice::$TAG has no $SLUG.php (a 1.x or pre-rename release), skipping the wordpress.org deploy"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          fi

      - uses: shivammathur/setup-php@v2
        if: steps.check.outputs.deploy
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Build the plugin as released
        if: steps.check.outputs.deploy
        run: .github/scripts/build-plugin.sh "$TAG" build

      # Commits build/<slug> to trunk and tags/<version>, and .wordpress-org/ (banner, icon, screenshots) to assets/.
      - uses: 10up/action-wordpress-plugin-deploy@2.3.0
        if: steps.check.outputs.deploy
        env:
          BUILD_DIR: build/${{ env.SLUG }}
          ASSETS_DIR: .wordpress-org
