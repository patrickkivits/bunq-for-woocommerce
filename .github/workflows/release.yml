name: Release

# Builds a plugin zip whose top-level folder is always "bunq-for-woocommerce/"
# and attaches it to the GitHub release. GitHub's own source archives unpack to
# "bunq-for-woocommerce-<tag>/", which makes WordPress treat every release as a
# different plugin instead of an upgrade of the installed one.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build the zip for, e.g. v1.5.9'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and attach plugin zip
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SLUG: bunq-for-woocommerce
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check that the plugin header version matches the tag
        run: |
          header=$(sed -n 's/^ \* Version: *//p' "$SLUG.php" | head -n1)
          echo "Tag: $TAG, plugin header: $header"
          if [ "v$header" != "$TAG" ] && [ "$header" != "$TAG" ]; then
            echo "::error::Plugin header version ($header) does not match release tag ($TAG)"
            exit 1
          fi

      - name: Build the zip with a fixed top-level folder
        run: |
          # The committed vendor/ directory is included; development files are
          # stripped from the zip afterwards.
          git archive --format=zip --prefix="$SLUG/" -o "$SLUG.zip" "$TAG"
          zip -q -d "$SLUG.zip" \
            "$SLUG/.github/*" "$SLUG/.gitignore" \
            "$SLUG/.idea/*" "$SLUG/.DS_Store" "$SLUG/.claude/*" \
            "$SLUG/tests/*" "$SLUG/phpunit.xml.dist" || true
          unzip -l "$SLUG.zip" | head -n 20

      - name: Check that the zip holds every tracked file and nothing else
        run: |
          # Everything tracked at the tag, minus the stripped development paths,
          # must be in the zip under the fixed folder; anything else is a leak.
          git ls-tree -r --name-only "$TAG" \
            | grep -vE '^(\.github/|\.gitignore$|\.idea/|\.DS_Store$|\.claude/|tests/|phpunit\.xml\.dist$)' \
            | sed "s|^|$SLUG/|" | sort > expected.txt
          unzip -Z1 "$SLUG.zip" | grep -v '/$' | sort > actual.txt
          if ! diff -u expected.txt actual.txt; then
            echo "::error::Zip content differs from the tracked files ('-' missing from zip, '+' unexpected in zip)"
            exit 1
          fi
          echo "$(wc -l < actual.txt) files verified"

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$SLUG.zip" --clobber
