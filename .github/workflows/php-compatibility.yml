name: PHP compatibility

on:
  # Branch pushes are covered by their pull request; running on both would test every PR commit twice.
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, curl, json, mbstring
          coverage: none
          tools: composer:v2

      # The plugin has no third-party dependencies; vendor/ only holds the Composer autoloader the zip ships.
      - name: Install the autoloader
        run: composer install --no-dev --no-interaction --no-progress

      - name: Syntax check the plugin
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n1 -P4 php -l \
            | { ! grep -v 'No syntax errors'; }

      # Any notice, including deprecations, fails the step.
      - name: Load the plugin's API clients at runtime
        run: |
          php -d error_reporting=E_ALL -d display_errors=1 -r '
            set_error_handler(function ($level, $message, $file, $line) {
                fwrite(STDERR, "$message in $file:$line\n");
                exit(1);
            });
            define("ABSPATH", __DIR__ . "/");
            require "vendor/autoload.php";
            \PatrickKivits\BunqForWooCommerce\Bunq\ApiClient::generate_key_pair();
            class_exists(\PatrickKivits\BunqForWooCommerce\Bunq\OAuthClient::class) || exit(1);
            class_exists(\PatrickKivits\BunqForWooCommerce\Bunq\TransportException::class) || exit(1);
            echo "OK\n";
          '
